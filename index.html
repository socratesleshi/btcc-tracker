<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitcoin Live</title>
<meta name="theme-color" content="#101426">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#101426;--panel:#181e38;--line:#262d4d;--text:#eef0f8;--muted:#8a91b0;--up:#3ddc97;--down:#ff6b6b;--btc:#f7931a;--tone:var(--muted)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));display:flex;justify-content:center}
main{width:100%;max-width:560px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}
.pair{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:600;font-size:16px}
.coin{width:28px;height:28px;border-radius:50%;background:var(--btc);display:grid;place-items:center;color:#fff;font-weight:800}
.status{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.live .dot{background:var(--up);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.price{font-size:clamp(46px,15vw,76px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;color:var(--tone);transition:color 1.2s ease-out}
.price.flash{transition:none}
.change{margin-top:10px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px 8px}
.chart svg{width:100%;height:180px;display:block}
.chart small{display:block;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stats div{background:var(--panel);padding:14px 16px}
.stats span{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.stats b{font-size:18px;font-variant-numeric:tabular-nums}
footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
button{font:inherit;font-weight:600;background:var(--btc);color:#1a1202;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
button[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none}.price{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div class="pair"><span class="coin">₿</span>Bitcoin · BTC/USD</div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Connecting</span></div>
  </header>
  <section>
    <div class="price" id="price">$––</div>
    <div class="change" id="change">&nbsp;</div>
  </section>
  <section class="chart">
    <svg id="chart" viewBox="0 0 520 180" preserveAspectRatio="none" role="img" aria-label="Bitcoin price over the last 24 hours"></svg>
    <small>Last 24 hours</small>
  </section>
  <section class="stats">
    <div><span>24h high</span><b id="high">––</b></div>
    <div><span>24h low</span><b id="low">––</b></div>
    <div><span>Bid</span><b id="bid">––</b></div>
    <div><span>Ask</span><b id="ask">––</b></div>
    <div><span>24h volume</span><b id="vol">––</b></div>
    <div><span>Updated</span><b id="time">––</b></div>
  </section>
  <footer><span>Prices from Coinbase</span><button id="install" hidden>Install app</button></footer>
</main>
<script>
const $=id=>document.getElementById(id);
const usd=(n,d=2)=>n.toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:d,maximumFractionDigits:d});
let last=null,series=[],ws,tries=0,timer;

function setStatus(live,text){$('status').className='status'+(live?' live':'');$('statusText').textContent=text}

function draw(){
  if(series.length<2)return;
  const min=Math.min(...series),max=Math.max(...series),r=max-min||1,w=520,h=180,p=6;
  const pts=series.map((v,i)=>[i/(series.length-1)*w,h-p-(v-min)/r*(h-p*2)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const c=series[series.length-1]>=series[0]?'#3ddc97':'#ff6b6b';
  $('chart').innerHTML=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".28"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><path d="${line}L${w} ${h}L0 ${h}Z" fill="url(#g)"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
}

function onTick(m){
  const price=+m.price,el=$('price');
  if(last!==null&&price!==last){
    el.classList.add('flash');el.style.setProperty('--tone',price>last?'var(--up)':'var(--down)');
    void el.offsetWidth;el.classList.remove('flash');el.style.setProperty('--tone','var(--text)');
  }else if(last===null){el.style.setProperty('--tone','var(--text)')}
  last=price;el.textContent=usd(price);
  if(m.open_24h){const o=+m.open_24h,d=price-o,pct=d/o*100,ch=$('change');
    ch.className='change '+(d>=0?'up':'down');
    ch.textContent=`${d>=0?'▲':'▼'} ${usd(Math.abs(d))} (${Math.abs(pct).toFixed(2)}%) today`}
  if(m.high_24h)$('high').textContent=usd(+m.high_24h);
  if(m.low_24h)$('low').textContent=usd(+m.low_24h);
  if(m.best_bid)$('bid').textContent=usd(+m.best_bid);
  if(m.best_ask)$('ask').textContent=usd(+m.best_ask);
  if(m.volume_24h)$('vol').textContent=(+m.volume_24h).toLocaleString('en-US',{maximumFractionDigits:0})+' BTC';
  $('time').textContent=new Date().toLocaleTimeString();
  if(series.length){series[series.length-1]=price;draw()}
}

async function history(){
  try{
    const r=await fetch('https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=300');
    const a=await r.json();
    series=a.sort((x,y)=>x[0]-y[0]).map(c=>c[4]);draw();
  }catch(e){}
}

function connect(){
  clearTimeout(timer);
  if(ws&&ws.readyState<2)ws.close();
  setStatus(false,'Connecting');
  ws=new WebSocket('wss://ws-feed.exchange.coinbase.com');
  ws.onopen=()=>{tries=0;ws.send(JSON.stringify({type:'subscribe',product_ids:['BTC-USD'],channels:['ticker']}))};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ticker'){setStatus(true,'Live');onTick(m)}};
  ws.onclose=()=>{setStatus(false,'Reconnecting');timer=setTimeout(connect,Math.min(1000*2**tries++,15000))};
  ws.onerror=()=>ws.close();
}

document.addEventListener('visibilitychange',()=>{if(!document.hidden){history();if(!ws||ws.readyState>1)connect()}});
window.addEventListener('online',connect);
window.addEventListener('offline',()=>setStatus(false,'Offline'));

let deferred;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});
$('install').onclick=async()=>{deferred.prompt();await deferred.userChoice;$('install').hidden=true};

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
history();connect();
</script>
</body>
</html>
